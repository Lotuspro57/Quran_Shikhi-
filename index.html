<head>

<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.updbar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:60;background:var(--green-d);color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.updin{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));max-width:1040px;margin:0 auto}

.updbar .pbtn{background:#fff;color:var(--green-d);box-shadow:none;min-width:0;padding:8px 14px}

<title>আরবি শিখি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header (brand, age mode, theme) + five-tab nav (top on wide screens, bottom bar on phones).
   Home is a three-stage path (প্রাথমিক, মধ্যম, উচ্চতর) of lesson cards; tools open as full views; letter detail is a sheet. */
:root{
  --bg:#ffffff; --bg2:#F1F8F3; --card:#ffffff; --fg:#08130D; --muted:#46584D; --line:#CFE2D5;
  --green:#0D7A3D; --green-d:#085A2C; --green-l:#DDF2E4; --on-green:#ffffff;
  --f-ui:'Hind Siliguri','Amiri','Noto Sans Bengali',system-ui,sans-serif;
  --f-head:'Anek Bangla','Hind Siliguri',system-ui,sans-serif;
  --f-ar:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --scale:1; --r:12px; --fs:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#040906; --bg2:#0B140E; --card:#09110C; --fg:#F1F8F3; --muted:#9CB2A3; --line:#1D2D23;
  --green:#3ED47C; --green-d:#2DB766; --green-l:#0E2417; --on-green:#03100A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#040906; --bg2:#0B140E; --card:#09110C; --fg:#F1F8F3; --muted:#9CB2A3; --line:#1D2D23;
  --green:#3ED47C; --green-d:#2DB766; --green-l:#0E2417; --on-green:#03100A; color-scheme:dark}
:root[data-age="kid"]{--scale:1.16;--r:22px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 calc(16px*var(--scale))/1.65 var(--f-ui);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{padding-block:20px 40px;outline:none}
h1,h2,h3{font-family:var(--f-head);line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:1.9em;font-weight:800}h2{font-size:1.35em;font-weight:700}h3{font-size:1.08em;font-weight:700}
p{margin:0}
a{color:var(--green)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.ar{font-family:var(--f-ar);direction:rtl;line-height:1.9;font-weight:400}
.eyebrow{font-size:.78em;letter-spacing:.06em;font-weight:600;color:var(--green)}
.lead{color:var(--muted);margin-top:6px;max-width:60ch}
.muted{color:var(--muted)}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand-ar{background:var(--green);color:var(--on-green);border-radius:10px;padding:0 12px;font-size:1.35em;line-height:1.7}
.brand-bn{font-family:var(--f-head);font-weight:800;font-size:1.25em}
.ctl{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1.5px solid var(--green);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 14px;font-weight:600;font-size:.88em}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.iconbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.88em;font-weight:600}
nav.tabs{border-top:1px solid var(--line)}
.tabs-in{display:flex;gap:4px;overflow-x:auto}
.tabs a{display:flex;align-items:center;gap:7px;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--green);border-bottom-color:var(--green)}
@media(max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);z-index:25;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs-in{justify-content:space-between;gap:0;overflow:visible}
  .tabs a{flex:1;flex-direction:column;gap:2px;padding:8px 2px;font-size:.72em;border-bottom:0;border-top:3px solid transparent;min-width:0;justify-content:center}
  .tabs a[aria-current="page"]{border-top-color:var(--green)}
  h1{font-size:1.55em}
}
/* buttons, chips, cards */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--green);background:var(--green);color:var(--on-green);border-radius:var(--r);padding:.6em 1.2em;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;color:var(--green)}
.btn.sm{padding:.3em .8em;font-size:.88em}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:14px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:.3em 1em;font-weight:600}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.back{display:inline-block;margin-bottom:12px;font-weight:600;text-decoration:none}
.lh{margin-bottom:18px}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
section.blk{margin-top:26px}
section.blk>h2{margin-bottom:6px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));margin-top:12px}
/* home */
.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--green);color:var(--on-green);border-radius:calc(var(--r) + 6px);padding:22px}
.hero .ar{font-size:3em;line-height:1.5}
.hero p{opacity:.92}
.hero .btn{background:var(--bg);color:var(--green-d);border-color:var(--bg)}
.hero-t{flex:1 1 220px;min-width:0}
.ring{width:92px;height:92px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.28)}.ring .fg{stroke:var(--on-green);stroke-linecap:round}
.ring text{fill:var(--on-green);font:700 22px var(--f-head);text-anchor:middle}
.stage{margin-top:30px}
.stage-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lvl{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px}
.lvl:hover{border-color:var(--green)}
.lvl .g{flex:none;width:3.1em;height:3.1em;border-radius:50%;background:var(--green-l);color:var(--green-d);display:grid;place-items:center;font-size:1.4em}
:root[data-theme="dark"] .lvl .g{color:var(--green)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lvl .g{color:var(--green)}}
.lvl .g .ar{line-height:1.3;font-size:1em}
.lvl b{display:block;font-family:var(--f-head)}
.lvl small{color:var(--muted)}
.lvl .st{margin-left:auto;font-size:.78em;font-weight:700;color:var(--green);white-space:nowrap}
.lvl.done{border-color:var(--green);background:var(--green-l)}
/* arabic cells */
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 6px;min-width:0}
.cell:hover,.tile:hover{border-color:var(--green)}
.cell .ar{font-size:calc(1.9em*var(--fs))}
.cell small{color:var(--muted);font-size:.82em;overflow-wrap:anywhere}
.cell .pic{font-size:1.5em;line-height:1.2}
.letters{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(5.4em,1fr))}
.tile{display:flex;flex-direction:column;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 4px;min-width:0}
.tile .tl{font-size:2.5em;line-height:1.5}
.tile .tn{font-size:.82em;color:var(--muted);text-align:center}
.cells{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(7.2em,1fr))}
.cells.w{grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr))}
.rule{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));margin-top:12px}
.rule .card .ar{font-size:2.4em;display:block;text-align:center}
.rule .card h3{margin-bottom:4px}
.rule .card p{color:var(--muted);font-size:.94em}
.tblw{overflow-x:auto;margin-top:12px;border:1.5px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:6px 10px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.82em;color:var(--muted);background:var(--bg2);font-weight:600}
tr:last-child td{border-bottom:0}
td .ar{font-size:1.7em}
td button{background:none;border:0;padding:0;line-height:1.2}
td small{display:block;color:var(--muted);font-size:.78em}
.eq{display:flex;align-items:center;flex-wrap:wrap;gap:8px;direction:ltr}
.eq .ar{font-size:1.9em}.eq span.op{color:var(--muted)}
.note{background:var(--green-l);border-radius:var(--r);padding:12px 14px;margin-top:12px;color:var(--fg)}
.say{border:0;background:transparent;padding:2px 6px;color:var(--green);vertical-align:middle}
.say svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:720px){.sheet{align-items:center}.sheet-in{border-radius:22px}}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:7.5em;line-height:1.3;text-align:center;color:var(--green)}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.forms div{border:1.5px solid var(--line);border-radius:var(--r);text-align:center;padding:4px}
.forms .ar{font-size:2.3em;display:block;line-height:1.5}
.forms small{font-size:.76em;color:var(--muted)}
.padw{position:relative;width:min(100%,300px);aspect-ratio:1;margin:10px auto 0;border:2px dashed var(--green);border-radius:var(--r);background:var(--bg2)}
.padw .ghost{position:absolute;inset:0;display:grid;place-items:center;font-size:12em;opacity:.16;pointer-events:none;color:var(--fg);line-height:1}
.padw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
/* quiz + cards */
.quiz{max-width:640px;margin:0 auto}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--green)}
.qp{display:grid;place-items:center;min-height:9em;margin-block:14px;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}
.qp .ar{font-size:4.6em;line-height:1.5}
.qp .qn{font-family:var(--f-head);font-size:2em;font-weight:700}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:420px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:.7em;font-weight:600;font-size:1.1em}
.opt .ar{font-size:2em;line-height:1.5;display:block}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt.ok{background:var(--green);color:var(--on-green);border-color:var(--green)}
.opt.bad{background:var(--fg);color:var(--bg);border-color:var(--fg);text-decoration:line-through}
.stars{font-size:2.4em;letter-spacing:.1em;color:var(--green)}
.flash{display:block;width:100%;min-height:15em;border:2px solid var(--green);background:var(--card);border-radius:calc(var(--r) + 6px);padding:20px;text-align:center}
.flash .ar{font-size:5.5em;line-height:1.5}
.flash .bk{font-size:1.4em;font-weight:600}
.flash .bk small{display:block;font-size:.65em;color:var(--muted);font-weight:400}
.flash .hint{color:var(--muted);font-size:.85em;margin-top:8px}
.line{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}
.line .ar{font-size:calc(2.1em*var(--fs));flex:1;text-align:right}
.line .tr{color:var(--muted);font-size:.9em;flex:0 0 38%;min-width:0}
.wd{background:none;border:0;padding:0 2px;font-family:var(--f-ar);font-size:inherit;border-radius:6px}
.wd:hover{background:var(--green-l)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:50;max-width:90vw;font-size:.9em}
.toast[hidden]{display:none}
.kv{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:12px}
.kv .card b{display:block;font:800 1.8em var(--f-head);color:var(--green)}
@media(prefers-reduced-motion:no-preference){.opt,.cell,.tile,.lvl{transition:border-color .15s,background .15s}}

.b2{font-size:2.3em;line-height:1.5}
.fam{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tut{background:var(--green-l);border-color:var(--green);margin-bottom:8px}
.tut p{margin-top:6px}
.steps{margin:8px 0 0;padding-left:1.3em}
.mist{margin:8px 0 0;padding-left:1.2em;color:var(--muted)}
td.l{text-align:start}
.pair{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media(max-width:520px){.pair{grid-template-columns:auto auto}.pair p{grid-column:1/-1}}
.chat{display:flex;flex-direction:column;gap:10px;margin-block:14px;min-height:6em}
.bub{max-width:92%;padding:10px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--card);overflow-wrap:anywhere}
.bub.u{align-self:flex-end;background:var(--green);color:var(--on-green);border-color:var(--green)}
.bub .gap{height:.6em}
.bub.a{align-self:flex-start}
textarea{font:inherit;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;flex:1 1 220px;min-width:0;resize:vertical}
.cert{border:3px double var(--green);border-radius:var(--r);padding:24px;text-align:center;margin-top:12px}
.cert input{font:700 1.3em var(--f-head);text-align:center;background:transparent;color:var(--fg);border:0;border-bottom:2px solid var(--green);max-width:100%}
.hint2{font-size:.9em;color:var(--muted)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:26;display:flex;align-items:center;gap:8px;background:var(--green);color:var(--on-green);border:0;border-radius:999px;padding:.6em 1.1em;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
@media(min-width:721px){.fab{bottom:24px}}
.chat.sm{max-height:42vh;overflow-y:auto;margin-block:6px}
.ask-in{display:flex;flex-direction:column;gap:8px}
body.ai{padding-bottom:0}
body.ai header.top,body.ai .fab{display:none}
body.ai #app{padding-block:0}
.aifull{display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0}
.aibar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.aibar .back{margin:0}
.aifull .chat{flex:1;min-height:0;overflow-y:auto;margin-block:10px}
.aifull form{padding-bottom:10px}
a.fab{text-decoration:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wh{text-align:center;font-size:.78em;color:var(--muted);font-weight:600;padding:4px 0}
.cd{border:1.5px solid var(--line);background:var(--card);border-radius:10px;min-height:3.3em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px;min-width:0;color:var(--fg)}
.cd.e{visibility:hidden}
.cd.st{background:var(--green-l)}
.cd.td{border-color:var(--green);border-width:2.5px}
.cd.sel{background:var(--green);color:var(--on-green);border-color:var(--green)}
.cd .dt{width:.55em;height:.55em;border-radius:50%;border:1.5px solid currentColor;display:block}
.cd .dt.f{background:currentColor}
.sess{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sess.ok>div b{text-decoration:line-through;color:var(--muted)}
.tick{flex:none;width:1.7em;height:1.7em;border:2px solid var(--green);border-radius:7px;background:transparent;color:var(--on-green);display:grid;place-items:center;padding:0}
.tick[aria-checked="true"]{background:var(--green)}
.tick[aria-checked="true"]::after{content:"✓";font-weight:700}
input[type="time"],input[type="date"]{font:inherit;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px}
details.mon>summary{cursor:pointer;list-style:none}
details.mon>summary::-webkit-details-marker{display:none}
.ay.on{outline:3px solid var(--green);background:var(--green-l)}
@media(max-width:720px){
  .tabs-in{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding-left:4px;padding-right:4px}
  .tabs a{flex-direction:row;gap:4px;padding:6px 2px;font-size:.78em;line-height:1.3;border-top:0;border-bottom:3px solid transparent;overflow:hidden;text-overflow:ellipsis}
  .tabs a svg{width:16px;height:16px;flex:none}
  .tabs a[aria-current="page"]{border-top-color:transparent;border-bottom-color:var(--green);background:var(--green-l)}
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .fab{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
body.ai{padding-bottom:0}
#daypanel{scroll-margin-top:130px}
.pbtn{flex:none;align-self:center;display:inline-flex;align-items:center;justify-content:center;min-width:84px;min-height:52px;padding:10px 18px;border-radius:14px;background:var(--green);color:var(--on-green);font-weight:700;font-size:1.05em;text-decoration:none;box-shadow:0 2px 0 var(--green-d)}
.pbtn:active{transform:translateY(1px);box-shadow:none}
</style>
</head>
<body>

function markActive(){
  const f=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  const n=new Date(),t=f(n),y=f(new Date(Date.now()-864e5));
  const p=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  S.days=S.days||{};S.days[p]=(S.days[p]||0)+1;
  if(S.streak.last===t){save();return}
  S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=t;save();
}

function speak(t){
  try{
    if(!('speechSynthesis' in window))throw 0;
    const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith('ar'));
    if(!v){toast('এই ডিভাইসে আরবি ভয়েস পাওয়া যায়নি');return}
    const u=new SpeechSynthesisUtterance(t);u.lang=v.lang;u.voice=v;u.rate=.7;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast('এখানে উচ্চারণ শোনা যাচ্ছে না')}
}

function render(keepScroll){

  app.innerHTML=html;
  const tab=({level:'home',home:'home',practice:'practice',cards:'cards',read:'read',progress:'progress'})[a]||'home';
  document.querySelectorAll('[data-tab]').forEach(x=>{if(x.dataset.tab===tab)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});

function initPad(){
  const c=$('#pad');if(!c)return;
  const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;
  c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);
  const x=c.getContext('2d');x.scale(d,d);x.lineWidth=11;x.lineCap='round';x.lineJoin='round';
  x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--green').trim()||'#0D7A3D';
  let on=false;
  const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.addEventListener('pointerdown',e=>{on=true;c.setPointerCapture(e.pointerId);const[p,q]=pt(e);x.beginPath();x.moveTo(p,q);x.lineTo(p+.1,q+.1);x.stroke()});
  c.addEventListener('pointermove',e=>{if(!on)return;const[p,q]=pt(e);x.lineTo(p,q);x.stroke();x.beginPath();x.moveTo(p,q)});
  const off=()=>{on=false};c.addEventListener('pointerup',off);c.addEventListener('pointercancel',off);
  c._clear=()=>x.clearRect(0,0,r.width,r.height);
}

কাজের নিয়ম:

async function sendTutor(p){
  p=p||'t';
  const ta=$('#'+p+'in'),text=((ta&&ta.value)||'').trim();if(!text||TBUSY)return;
  ta.value='';pushTurn('user',text);
  const chat=$('#'+p+'chat');if(S.turns.length===1)chat.innerHTML='';
  chat.insertAdjacentHTML('beforeend',bub('user',text)+'<div class="bub a" id="live">ওস্তাদ ভাবছেন...</div>');
  const live=$('#live');live.removeAttribute('id');live.scrollIntoView({block:'nearest'});
  TBUSY=true;const sb=$('#'+p+'send'),st=$('#'+p+'stop');if(sb)sb.disabled=true;if(st)st.hidden=false;
  const sm=await getSample();
  try{
    if(!sm){live.textContent='AI ওস্তাদ এখনো সংযুক্ত হয়নি। সংযুক্ত হলে এখানেই উত্তর পাবেন। ততক্ষণ পাঠের ‘সাধারণ ভুল’ অংশ ও অনুশীলন দেখুন।';return}
    TCTL=new AbortController();
    const r=await sm([{role:'user',content:rules()},...S.turns],{cache:false,signal:TCTL.signal,onText:({text})=>{live.innerHTML=fmt(text);live.scrollIntoView({block:'nearest'})}});
    pushTurn('assistant',r.text);live.innerHTML=fmt(r.text);
  }catch(e){
    const c=(e&&e.code)||'upstream_error';
    if(e&&e.text)live.innerHTML=fmt(e.text)+`<div class="hint2">${ERR[c]||ERR.upstream_error}</div>`;else live.textContent=ERR[c]||ERR.upstream_error;
  }finally{
    TBUSY=false;TCTL=null;const a=$('#'+p+'send'),b=$('#'+p+'stop');if(a)a.disabled=false;if(b)b.hidden=true;
  }
}

let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){try{speechSynthesis.onvoiceschanged=loadVoices}catch(_){}}}
function speak(t){
  if(!('speechSynthesis' in window)){toast('এই ব্রাউজারে উচ্চারণ শোনার সুবিধা নেই');return}
  try{
    loadVoices();
    const v=VOICES.find(x=>/^ar/i.test(x.lang||''));
    const u=new SpeechSynthesisUtterance(t);u.lang=v?v.lang:'ar-SA';if(v)u.voice=v;u.rate=.7;
    let started=false;u.onstart=()=>{started=true};
    u.onerror=ev=>toast(ev&&ev.error==='not-allowed'?'এই ভিউতে শব্দ চালানো যাচ্ছে না। পেজটি নতুন ট্যাবে খুলে দেখুন।':'শব্দ চালানো যায়নি। ডিভাইসে আরবি ভয়েস আছে কি না দেখুন।');
    speechSynthesis.cancel();speechSynthesis.speak(u);
    if(!v)setTimeout(()=>{if(!started&&!speechSynthesis.speaking)toast('আপনার ডিভাইসে আরবি ভয়েস ইনস্টল করা নেই')},1500);
  }catch(e){toast('এখানে উচ্চারণ শোনা যাচ্ছে না')}

function schedule(){
  const p=S.plan,o=p.order,n=p.n,s0=pdt(p.start),days=[];
  for(let d=0;d<n;d++)days.push({key:dk(addD(s0,d)),d,ids:[],ref:null});
  o.forEach((id,k)=>{days[Math.min(n-1,Math.floor(k*n/o.length))].ids.push(id)});
  let last=null;days.forEach(x=>{if(x.ids.length)last=x.ids[x.ids.length-1];else x.ref=last});
  return days;
}
const byKey=days=>{const m={};days.forEach(x=>{m[x.key]=x});return m};
const dayDone=x=>x.ids.length?x.ids.every(i=>S.pdone[i]):!!S.rt[x.key];

function sessItem(x){

function dayBody(key,by){
  const x=by[key];let h='';
  const hist=Object.keys(S.pdone).filter(i=>S.pdone[i]===key&&!(x&&x.ids.includes(+i))).map(Number);
  if(x&&x.ids.length)h+=x.ids.map(i=>sessItem({i,done:!!S.pdone[i]})).join('');
  else if(x&&x.ref!=null)h+=`<div class="note" style="margin-top:0">অনুশীলনের দিন। নতুন সেশন নেই, ‘${SESS[x.ref][1]}’ ঝালাই করুন।</div><div class="row" style="gap:6px;margin:8px 0">${SESS[x.ref][3].map(lk).join('')}</div>`;
  h+=hist.map(i=>sessItem({i,done:1})).join('');
  if(!x&&!hist.length)h+='<p class="muted" style="padding:8px 0">এই দিনে সূচিতে কিছু নেই।</p>';

  return h+(n?`<p class="hint2" style="margin-top:8px">এই দিনে ${bd(n)}টি অনুশীলনের কাজ করেছেন।</p>`:'');
}

function todayPlanItems(){
  if(!S.plan)return [['নিজের সময়সূচি বানাই','#plan']];
  const days=schedule(),tk=todayK(),t=days.find(x=>x.key===tk);
  if(t&&!dayDone(t))return [[t.ids.length?`আজকের সেশন: ${t.ids.map(i=>SESS[i][1]).join(' + ')}`:'আজ অনুশীলনের দিন: ঝালাই করুন','#plan']];
  const nx=days.find(x=>x.key>tk&&!dayDone(x));
  return nx?[[`পরের সূচি (${dlabel(nx.key)}): ${nx.ids.length?SESS[nx.ids[0]][1]:'অনুশীলনের দিন'}`,'#plan']]:[];
}
function buildCsv(){
  const t=S.plan.time||'20:00',[h,m]=t.split(':').map(Number);
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const f12=d=>{const hh=d.getHours();return pad(hh%12||12)+':'+pad(d.getMinutes())+' '+(hh>=12?'PM':'AM')};
  const fd=d=>pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+d.getFullYear();
  const rows=[['Subject','Start Date','Start Time','End Date','End Time','Description','All Day Event'].map(q).join(',')];
  schedule().filter(x=>!dayDone(x)).forEach(x=>{
    const title=x.ids.length?x.ids.map(i=>SESS[i][1]).join(' + '):'অনুশীলন'+(x.ref!=null?': '+SESS[x.ref][1]:''),
      mins=(x.ids.length?x.ids.reduce((a,i)=>a+SESS[i][2],0):20)+10,d=pdt(x.key),
      a=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m),e=new Date(a.getTime()+mins*60000);
    rows.push([q('আরবি শিখি: '+title),q(fd(a)),q(f12(a)),q(fd(e)),q(f12(e)),q(title+' ('+mins+' মিনিট, দৈনিক ঝালাইসহ)'),q('False')].join(','));
  });
  return rows.join('\r\n');
}
async function exportCsv(){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){toast('এই ভিউতে ফাইল সংরক্ষণ চালু নেই');return}
  try{await dl.save({filename:'arabi-shikhi-schedule.csv',data:buildCsv()});toast('ফাইল সংরক্ষিত হয়েছে')}
  catch(e){if(!(e&&e.code==='declined'))toast('ফাইল সংরক্ষণ করা যায়নি')}
}
function replanNow(){
  const p=S.plan,pend=allIdx().filter(i=>!S.pdone[i]);
  p.order=pend;p.n=Math.max(7,Math.round(p.n0*pend.length/SESS.length));p.start=todayK();save();
}

const QS=QDATA.map(d=>({...d,tr:d.tr||TEXTS.find(x=>x.id===d.id).bn}));
let QPLAY=null;
function qstop(){QPLAY=null;try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll('.ay.on').forEach(x=>x.classList.remove('on'))}
function qplay(s,from){
  if(!('speechSynthesis' in window)){toast('এই ব্রাউজারে উচ্চারণ শোনার সুবিধা নেই');return}
  qstop();const tok=QPLAY={};loadVoices();
  const v=VOICES.find(x=>/^ar/i.test(x.lang||''));
  const next=i=>{
    if(QPLAY!==tok)return;
    document.querySelectorAll('.ay.on').forEach(x=>x.classList.remove('on'));
    if(i>=s.ar.length){QPLAY=null;const b=document.getElementById('qplaybtn');if(b)b.textContent='▶ পুরো সূরা শুনি';return}
    const el=document.getElementById('ay'+i);if(el){el.classList.add('on');try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}}
    const u=new SpeechSynthesisUtterance(s.ar[i]);u.lang=v?v.lang:'ar-SA';if(v)u.voice=v;u.rate=.65;
    u.onend=()=>setTimeout(()=>next(i+1),350);
    u.onerror=()=>{if(QPLAY===tok){QPLAY=null;toast('শব্দ চালানো যায়নি। ডিভাইসে আরবি ভয়েস আছে কি না দেখুন।')}};
    speechSynthesis.speak(u);
  };
  next(from||0);
}
function viewQuran(id){
  const s=QS.find(x=>x.id===id);
  if(!s)return `<h1>আল-কুরআন</h1><p class="lead">প্রতিটি আয়াতে প্রথমে আরবি, তার নিচে বাংলা উচ্চারণ, তারপর বাংলা অর্থ। এখন ${bd(QS.length)}টি সূরা আছে।</p>
  <div>${QS.map(x=>`<a class="card" href="#quran-${x.id}" style="display:block;text-decoration:none;color:inherit;margin-bottom:10px"><div class="row sp"><b>${bd(x.no)}. সূরা ${x.n}</b><small class="muted">${bd(x.ar.length)} আয়াত</small></div><div class="muted">${x.m} · ${x.ty}</div><p class="ar" lang="ar" dir="rtl" style="font-size:1.5em;line-height:2;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x.ar[0]}</p></a>`).join('')}</div>
  <p class="muted" style="margin-top:14px">আরও সূরা পরের ধাপে যুক্ত হবে। আরবি পাঠ: The Noble Qur’an Encyclopedia (quranenc.com)। বাংলা অনুবাদ: মুহিউদ্দীন খান (tanzil.net)। বাংলা উচ্চারণ শেখার সহায়ক মাত্র; সঠিক উচ্চারণের জন্য ক্বারীর তেলাওয়াত শুনুন ও শিক্ষকের কাছে যাচাই করুন।</p>`;
  const i=QS.indexOf(s),pv=QS[i-1],nx=QS[i+1];
  return `<a class="back" href="#quran">← সব সূরা</a><h1>সূরা ${s.n}</h1><p class="muted">${s.m} · ${s.ty} · ${bd(s.ar.length)} আয়াত</p>
  <div class="row" style="margin:10px 0"><button type="button" class="btn" id="qplaybtn" data-act="qplay" data-id="${s.id}">▶ পুরো সূরা শুনি</button><button type="button" class="btn ghost" data-act="qstop">থামাই</button></div>
  ${s.ar.map((l,k)=>`<section class="card ay" id="ay${k}" style="margin-bottom:10px"><div class="row sp"><span class="st">${bd(k+1)}</span><button type="button" class="say" data-act="qay" data-id="${s.id}" data-k="${k}" aria-label="আয়াত ${bd(k+1)} শুনুন">${ICON_SPK}</button></div>
  <p class="ar" lang="ar" dir="rtl" style="font-size:1.9em;line-height:2.1;margin:6px 0">${l}</p>
  <p class="tr" style="font-weight:600">${s.tr[k]}</p><p class="muted" style="margin-top:4px">${s.mn[k]}</p></section>`).join('')}
  <p class="hint2">ডিভাইসের আরবি ভয়েসে ধীর গতিতে শোনানো হয়; এটি কোনো ক্বারীর রেকর্ড করা তেলাওয়াত নয়।</p>
  <div class="row sp" style="margin-top:12px">${pv?`<a class="btn ghost sm" href="#quran-${pv.id}">← ${pv.n}</a>`:'<span></span>'}${nx?`<a class="btn ghost sm" href="#quran-${nx.id}">${nx.n} →</a>`:''}</div>`;
}
Object.assign(ACT,{qay:t=>{const s=QS.find(x=>x.id===t.dataset.id),k=+t.dataset.k;if(!s)return;if(window.qAudio)window.qAudio(s,k,false);else speak(s.ar[k])},qplay:t=>{const s=QS.find(x=>x.id===t.dataset.id);if(s){qplay(s,0);t.textContent='▶ চলছে…'}},qstop:()=>{qstop();const b=document.getElementById('qplaybtn');if(b)b.textContent='▶ পুরো সূরা শুনি'}});

const _homeBase=viewHome;
viewHome=function(){
  if(!S.plan){S.plan={n0:60,n:60,order:allIdx(),time:'20:00',start:todayK()};save()}
  const days=schedule(),tk=todayK(),over=days.filter(x=>x.key<tk).flatMap(x=>x.ids).filter(i=>!S.pdone[i]).length;
  const doneN=Object.keys(S.pdone).length,last=days.length?dlabel(days[days.length-1].key):'';
  const first=days.length?dlabel(days[0].key):'';
  const head=`<section class="blk"><div class="row sp"><h1 style="margin:0">আমার ক্যালেন্ডার</h1><a class="btn ghost sm" href="#plan">মাসিক সূচি ও সেটিং</a></div>
  <p class="lead">${bd(S.plan.n)} দিনে ${bd(SESS.length)}টি সেশনে পুরো কোর্স ভাগ করা আছে: ${first} থেকে ${last} পর্যন্ত। প্রতিদিনের কাজ সম্পন্ন হলে টিক দিন।</p>
  <div class="card" style="margin-bottom:10px"><div class="row sp"><b>${bd(doneN)}/${bd(SESS.length)} সেশন সম্পন্ন</b><span class="muted">${bd(S.plan.n)} দিনের সূচি</span></div><div class="bar" style="margin-top:8px"><i style="width:${doneN/SESS.length*100}%"></i></div></div>
  ${over?`<div class="note">${bd(over)}টি সেশন নির্ধারিত দিনের পরে বাকি আছে। <button type="button" class="btn sm" data-act="preplan" style="margin-left:6px">আজ থেকে নতুন করে সাজাই</button></div>`:''}
  ${calHtml(days)}</section>`;
  return head+_homeBase();
};

const nextSess=()=>{
  const days=schedule(),tk=todayK();
  for(const x of days){if(x.key>tk)break;for(const i of x.ids)if(!S.pdone[i])return{i,x,days}}
  const t=days.find(x=>x.key===tk);
  if(t&&t.ids.length)return{i:t.ids[t.ids.length-1],x:t,days,all:true};
  for(const x of days){if(x.key>tk)for(const i of x.ids)if(!S.pdone[i])return{i,x,days,later:true}}
  return{i:null,days};
};

render=function(keepScroll){
  const h=(location.hash||'#home').slice(1),i=h.indexOf('-');
  const a=i<0?h:h.slice(0,i),b=i<0?'':h.slice(i+1);
  if(a!=='tutor')ST.from=location.hash||'#home';

    case'plan':html=sub('plan',MSUB)+viewPlan();break;
    case'quran':html=viewQuran(b);break;
    case'dua':html=viewDua();break;
    case'progress':html=sub('progress',MSUB)+viewProgress();break;

  }
  app.innerHTML=html;
  const tab=({home:'home',level:'lessons',lessons:'lessons',practice:'lessons',cards:'lessons',read:'lessons',quran:'quran',dua:'dua',plan:'progress',progress:'progress'})[a]||'home';
  document.querySelectorAll('[data-tab]').forEach(x=>{if(x.dataset.tab===tab)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});
  const fab=$('#askfab');if(fab)fab.hidden=(a==='tutor');
  document.body.classList.toggle('ai',a==='tutor');
  if(a==='tutor'){const c=$('#tchat');if(c)c.scrollTop=c.scrollHeight}
  if(!keepScroll)window.scrollTo(0,0);
};

/* ---------- অ্যাপ আপডেট (স্বতন্ত্র অ্যাপ সংস্করণ) ---------- */
const APP_VERSION='1.4.0';
const UPD={info:null,msg:'',busy:false,last:0};
const verParts=v=>String(v).split('.').map(n=>parseInt(n,10)||0);
const verGt=(a,b)=>{const x=verParts(a),y=verParts(b);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
async function fetchInfo(){
  const base=(window.ARABI_CONFIG||{}).versionUrl||'version.json';
  const r=await fetch(base+(base.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
function updBar(){
  let b=document.getElementById('updbar');
  const i=UPD.info;
  if(!i||!verGt(i.version,APP_VERSION)){if(b)b.hidden=true;return}
  if(!b){b=document.createElement('div');b.id='updbar';b.className='updbar';b.setAttribute('role','status');document.body.appendChild(b)}
  b.hidden=false;
  b.innerHTML=`<div class="updin"><div style="min-width:0;flex:1"><b>নতুন আপডেট এসেছে (${bd(i.version)})</b><div class="updn">${(i.notes||[]).slice(0,3).map(n=>'• '+n).join('<br>')}</div></div><button type="button" class="pbtn" data-act="updnow" style="min-height:44px">আপডেট করুন</button><button type="button" class="updx" data-act="updhide" aria-label="বন্ধ করুন">×</button></div>`;
}
async function checkUpdate(manual){
  if(UPD.busy)return;UPD.busy=true;
  try{
    UPD.info=await fetchInfo();UPD.last=Date.now();
    UPD.msg=verGt(UPD.info.version,APP_VERSION)?`নতুন সংস্করণ ${bd(UPD.info.version)} পাওয়া গেছে।`:'আপনার অ্যাপ সর্বশেষ সংস্করণে আছে।';
    updBar();
  }catch(e){UPD.msg='এখন আপডেট দেখা যাচ্ছে না। ইন্টারনেট সংযোগ দেখে আবার চেষ্টা করুন।'}
  finally{UPD.busy=false}
  if(manual&&location.hash==='#progress')rerender(true);
}
async function applyUpdate(){
  const apk=(window.ARABI_CONFIG||{}).apkUrl;
  if(apk&&window.Capacitor){try{window.open(apk,'_blank')}catch(e){location.href=apk}return}
  try{localStorage.setItem('arabi-just-updated',(UPD.info&&UPD.info.version)||'')}catch(e){}
  try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(e){}
  try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('arabi-shikhi-')).map(k=>caches.delete(k)))}}catch(e){}
  location.reload();
}
const _progBase=viewProgress;
viewProgress=function(){
  const i=UPD.info,newer=i&&verGt(i.version,APP_VERSION);
  const sec=`<section class="blk card"><h2>অ্যাপ আপডেট</h2><p class="muted">বর্তমান সংস্করণ: ${bd(APP_VERSION)}</p>
  ${UPD.msg?`<p style="margin:8px 0"><b>${UPD.msg}</b></p>`:''}
  ${i&&(i.notes||[]).length?`<p class="muted" style="margin-top:6px">${newer?'নতুন সংস্করণে যা আছে':'সর্বশেষ পরিবর্তন'} (${bd(i.version)}):</p><ul style="margin:4px 0 8px 1.2em">${i.notes.map(n=>`<li>${n}</li>`).join('')}</ul>`:''}
  <div class="row"><button type="button" class="btn ghost" data-act="updcheck">${UPD.busy?'দেখা হচ্ছে…':'আপডেট আছে কি না দেখি'}</button>${newer?'<button type="button" class="btn" data-act="updnow">এখনই আপডেট করি</button>':''}</div>
  <p class="hint2" style="margin-top:8px">আপডেটে আপনার অগ্রগতি, তারা ও সূচি মোছে না; সেগুলো এই ডিভাইসেই সংরক্ষিত থাকে।</p></section>`;
  return _progBase()+sec;
};
Object.assign(ACT,{
  updcheck:()=>{checkUpdate(true);rerender(true)},
  updnow:()=>applyUpdate(),
  updhide:()=>{const b=document.getElementById('updbar');if(b)b.hidden=true},
  pexport:async()=>{

      toast('ফাইল নামানো হয়েছে। Google Calendar-এ ইমপোর্ট করুন।');
    }catch(e){toast('ফাইল নামানো যায়নি')}
  }
});
/* AI ওস্তাদ: নিজের প্রক্সি সার্ভার (Cloudflare Worker) থাকলে version.json-এ "tutorEndpoint" দিন */
async function tutorEndpoint(){
  const c=(window.ARABI_CONFIG||{}).tutorEndpoint;if(c)return c;
  if(UPD.ep!==undefined)return UPD.ep;
  try{const i=await fetchInfo();UPD.ep=i.tutorEndpoint||'';}catch(e){UPD.ep=''}
  return UPD.ep;
}
function deviceId(){
  try{let d=localStorage.getItem('arabi-device');if(!d){d=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));localStorage.setItem('arabi-device',d)}return d}catch(e){return ''}
}
getSample=async()=>{
  const ep=await tutorEndpoint();if(!ep)return null;
  return async(msgs,opts)=>{
    const arr=Array.isArray(msgs)?msgs:[{role:'user',content:String(msgs)}];
    const system=arr[0]&&arr[0].role==='user'&&arr.length>1?arr[0].content:'';
    const messages=(system?arr.slice(1):arr).map(m=>({role:m.role,content:m.content}));
    let r;
    try{r=await fetch(ep,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({device:deviceId(),system,messages}),signal:opts&&opts.signal})}
    catch(e){if(e&&e.name==='AbortError')throw {code:'aborted'};throw {code:'upstream_error'}}
    if(r.status===429){
      let j={};try{j=await r.json()}catch(e){}
      const m=Math.max(1,Math.ceil((j.retryAfter||3600)/60));
      ERR.rate_limited=j.error==='limit'?`এই ঘণ্টার ${bd(j.limit||'')}টি প্রশ্নের সীমা শেষ। প্রায় ${bd(m)} মিনিট পর আবার জিজ্ঞাসা করুন। ততক্ষণ পাঠ ও অনুশীলন চালিয়ে যান।`:'এখন অনেকেই ওস্তাদকে প্রশ্ন করছে। এক মিনিট পর আবার চেষ্টা করুন।';
      throw {code:'rate_limited'};
    }
    if(!r.ok)throw {code:'upstream_error'};
    const j=await r.json();if(!j.text)throw {code:'upstream_error'};
    const t=j.text+(typeof j.remaining==='number'&&j.remaining<=2?`\n\n(এই ঘণ্টায় আর ${bd(j.remaining)}টি প্রশ্ন করা যাবে)`:'');
    if(opts&&opts.onText)opts.onText({text:t});return {text:t};
  };
};
/* শুরু: সার্ভিস ওয়ার্কার + আপডেট যাচাই */

/* ---------- Android অ্যাপে ফোনের নিজস্ব Text-to-Speech ---------- */
const NATIVE=!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform==='function'&&window.Capacitor.isNativePlatform());
let NTTS=null;
if(NATIVE){try{NTTS=window.Capacitor.registerPlugin('TextToSpeech')}catch(e){NTTS=null}}
const TTS_HELP='আরবি ভয়েস চালানো যায়নি। ফোনের সেটিংস > ভাষা > Text-to-speech এ গিয়ে Google ইঞ্জিনের আরবি ভয়েস ডাউনলোড করুন।';
function nspeak(t,rate){
  return Promise.resolve(NTTS.stop()).catch(()=>{}).then(()=>NTTS.speak({text:t,lang:'ar-SA',rate:rate||.7,pitch:1,volume:1,category:'ambient'}));
}
if(NTTS){
  speak=function(t){nspeak(t,.7).catch(()=>toast(TTS_HELP))};
}

/* ---------- ক্বারীর তেলাওয়াত (ইন্টারনেট থেকে) ---------- */
const RECS=[
 {id:'alafasy',n:'মিশারী আল-আফাসি',ea:'Alafasy_128kbps',isl:'ar.alafasy'},
 {id:'husary',n:'মাহমুদ খলীল আল-হুসারী (ধীর, শেখার জন্য সেরা)',ea:'Husary_128kbps',isl:'ar.husary'},
 {id:'sudais',n:'আবদুর রহমান আস-সুদাইস',ea:'Abdurrahmaan_As-Sudais_192kbps',isl:'ar.abdurrahmaansudais'},
 {id:'basit',n:'আবদুল বাসিত আবদুস সামাদ (মুরাত্তাল)',ea:'Abdul_Basit_Murattal_192kbps',isl:'ar.abdulbasitmurattal'},
 {id:'minshawi',n:'মুহাম্মদ সিদ্দীক আল-মিনশাবী (মুরাত্তাল)',ea:'Minshawy_Murattal_128kbps',isl:'ar.minshawi'}
];
let REC=(()=>{try{const v=localStorage.getItem('arabi-reciter');if(RECS.some(r=>r.id===v))return v}catch(e){}return 'alafasy'})();
const recObj=()=>RECS.find(r=>r.id===REC)||RECS[0];
const p3=n=>String(n).padStart(3,'0');
function ayUrls(s,k){
  const r=recObj(),u=[`https://everyayah.com/data/${r.ea}/${p3(s.no)}${p3(k+1)}.mp3`];
  if(s.g!=null)u.push(`https://cdn.islamic.network/quran/audio/128/${r.isl}/${s.g+k}.mp3`);
  return u;
}
const QA=new Audio();QA.preload='auto';let QTOK=null,QWARN=false;
function qhl(k){
  document.querySelectorAll('.ay.on').forEach(x=>x.classList.remove('on'));
  if(k==null)return;const el=document.getElementById('ay'+k);
  if(el){el.classList.add('on');try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}}
}
function qreset(){const b=document.getElementById('qplaybtn');if(b)b.textContent='▶ পুরো সূরা শুনি'}
function stopAll(){QTOK=null;try{QA.pause()}catch(e){}try{speechSynthesis.cancel()}catch(e){}try{if(NTTS)NTTS.stop()}catch(e){}qhl(null)}
function playOne(s,k,tok){
  return new Promise(res=>{
    const urls=ayUrls(s,k);let i=0;
    const fallback=()=>{
      if(QTOK!==tok)return res();
      if(!QWARN){QWARN=true;toast('ক্বারীর অডিও পাওয়া যায়নি (ইন্টারনেট দেখুন)। ডিভাইসের ভয়েসে শোনানো হচ্ছে।')}
      if(NTTS){nspeak(s.ar[k],.65).then(()=>res(),()=>{toast(TTS_HELP);res()});return}
      if(!('speechSynthesis' in window))return res();
      loadVoices();const v=VOICES.find(x=>/^ar/i.test(x.lang||'')),u=new SpeechSynthesisUtterance(s.ar[k]);
      u.lang=v?v.lang:'ar-SA';if(v)u.voice=v;u.rate=.65;u.onend=()=>res();u.onerror=()=>res();
      speechSynthesis.cancel();speechSynthesis.speak(u);
    };
    let cur=0,fell=false;
    const tryNext=()=>{
      if(QTOK!==tok)return res();
      if(i>=urls.length){if(!fell){fell=true;fallback()}return}
      const my=++cur;
      const bad=()=>{if(my===cur&&QTOK===tok){cur++;tryNext()}else if(QTOK!==tok)res()};
      QA.onended=()=>{if(my===cur)res()};
      QA.onerror=bad;
      QA.src=urls[i++];
      const pr=QA.play();if(pr&&pr.catch)pr.catch(e=>{if(!(e&&e.name==='AbortError'))bad()});
    };
    tryNext();
  });
}
async function runAyat(s,from,all){
  stopAll();const tok=QTOK={};
  for(let k=from;k<s.ar.length;k++){
    if(QTOK!==tok)return;
    qhl(k);await playOne(s,k,tok);
    if(!all)break;
    if(QTOK!==tok)return;
    await new Promise(r=>setTimeout(r,250));
  }
  if(QTOK===tok){QTOK=null;qhl(null);qreset()}
}
window.qAudio=(s,k,all)=>{runAyat(s,k,all)};
qplay=function(s,from){QWARN=false;runAyat(s,from||0,true)};
qstop=function(){stopAll();qreset()};
window.addEventListener('hashchange',()=>{stopAll()});
const _vq=viewQuran;
viewQuran=function(id){
  const h=_vq(id);if(!id||!QS.find(x=>x.id===id))return h;
  const sel=`<div style="margin:8px 0"><label for="qrec" class="muted">ক্বারী</label><br><select id="qrec" style="font:inherit;padding:8px;border-radius:10px;border:1.5px solid var(--green);background:var(--card);color:var(--fg);max-width:100%">${RECS.map(r=>`<option value="${r.id}" ${r.id===REC?'selected':''}>${r.n}</option>`).join('')}</select></div>`;
  return h.replace('<div class="row" style="margin:10px 0"><button type="button" class="btn" id="qplaybtn"',sel+'<div class="row" style="margin:10px 0"><button type="button" class="btn" id="qplaybtn"').replace('ডিভাইসের আরবি ভয়েসে ধীর গতিতে শোনানো হয়; এটি কোনো ক্বারীর রেকর্ড করা তেলাওয়াত নয়।','ক্বারীর তেলাওয়াত ইন্টারনেট থেকে চলে (EveryAyah ও Islamic Network)। ইন্টারনেট না থাকলে ডিভাইসের আরবি ভয়েসে শোনানো হয়।');
};
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='qrec'){REC=e.target.value;try{localStorage.setItem('arabi-reciter',REC)}catch(x){}stopAll();qreset();toast('ক্বারী বদলানো হয়েছে')}
});

prefs();render();
if('speechSynthesis' in window)try{speechSynthesis.getVoices()}catch(e){}
</script>
